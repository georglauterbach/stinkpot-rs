---
name: Release
run-name: Release

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ src/**, .github/** ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ '**' ]
    paths: [ src/**, .github/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Restrict default permissions for all jobs to read-only
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    container: docker.io/rust:1.97.1-slim-trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Packages
        run: |
          apt-get --yes --quiet=2 update
          apt-get --yes install gcc pkg-config

      - name: Test & Lint Code
        run: |
          cargo fmt    --all                              -- --check
          cargo clippy --workspace --quiet --all-features -- -D warnings
          cargo doc    --workspace --quiet --no-deps --document-private-items

      - name: Check
        run: cargo check

  release-build:
    name: Release Build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ${{ matrix.os }}
    container: docker.io/rust:1.97.1-slim-trixie

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            linker: x86_64-linux-musl-gcc
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            linker: aarch64-linux-musl-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Packages
        run: |
          apt-get --yes --quiet=2 update
          apt-get --yes install gcc musl-tools pkg-config

      - name: Build Release Binary
        run: |
          readonly VERSION=${{ github.ref_name }}
          sed -i -E "s/^(version =).*/\1 \"${VERSION#v}\"/" Cargo.toml

          rustup target add "${{ matrix.target }}"
          export CARGO_BUILD_TARGET=${{ matrix.target }}
          TARGET_ENV=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${TARGET_ENV}_LINKER=${{ matrix.linker }}"
          cargo build --release

          mkdir -p target/.artifacts
          mv "target/${{ matrix.target }}/release/stinkpot" \
            "target/.artifacts/stinkpot-${{ github.ref_name }}-${{ matrix.target }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stinkpot-${{ matrix.target }}
          path: target/.artifacts/stinkpot-${{ github.ref_name }}-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/.artifacts
          merge-multiple: true

      - name: Publish Artifacts to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/.artifacts/stinkpot-${{ github.ref_name }}-x86_64-unknown-linux-musl
            target/.artifacts/stinkpot-${{ github.ref_name }}-aarch64-unknown-linux-musl
